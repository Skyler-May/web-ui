<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiuMa H5 客户端</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="login" class="panel">
        <h1>NiuMa H5</h1>
        <label>游戏
            <select id="gameSelect">
                <option value="1031">斗地主</option>
                <option value="1032">跑得快</option>
                <option value="1024">牛牛</option>
                <option value="1033">浙江麻将</option>
            </select>
        </label>
        <label>玩家ID <input id="playerId" value="p1001" /></label>
        <div class="rooms">
            <div class="rooms-head">
                <span>可用房间</span>
                <button id="btnRefreshRooms" type="button">刷新</button>
            </div>
            <div id="roomList" class="room-list"><div class="empty">点「刷新」加载房间</div></div>
        </div>
        <label>房号 <input id="roomNumber" placeholder="6 位房号，或从上面选" /></label>
        <button id="btnLogin">登录并进房</button>
        <div id="loginMsg" class="hint"></div>
    </div>

    <div id="table" class="hidden">
        <header>
            <span id="roomInfo"></span>
            <span id="stateInfo"></span>
            <span id="seatInfo"></span>
            <span id="connState" class="conn ok">已连接</span>
            <button id="btnReconnect" type="button" title="手动重连">重连</button>
        </header>

        <section class="opponents">
            <div class="opp" id="opp1"><div class="name">座位1</div><div class="cards">?</div></div>
            <div class="opp" id="opp2"><div class="name">座位2</div><div class="cards">?</div></div>
            <div class="opp" id="opp3"><div class="name">座位3</div><div class="cards">?</div></div>
            <div class="opp" id="opp4"><div class="name">座位4</div><div class="cards">?</div></div>
        </section>

        <section class="tablearea">
            <div id="bottomCards" class="bottom"></div>
            <div id="playedArea" class="played"></div>
        </section>

        <section class="mine">
            <div id="myHand" class="hand"></div>
            <div id="actionBar" class="actionbar hidden"></div>
            <div class="actions">
                <button id="btnPlay" disabled>出牌</button>
                <button id="btnPass" disabled>不出</button>
                <button id="btnSync">同步</button>
            </div>
        </section>

        <footer id="log" class="log"></footer>
    </div>

    <script src="md5.js"></script>
    <script src="msgpack.js"></script>
    <script src="app.js"></script>
</body>
</html>
